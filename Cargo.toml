[package]
name = "hisi-rf"
version = "0.1.0-alpha.113"
edition = "2024"
rust-version = "1.91"
authors = ["sanchuanhehe"]
license = "MIT"
description = "Chip-selecting radio facade for HiSilicon embedded Rust"
repository = "https://github.com/hispark-rs/hisi-rf"
keywords = ["embedded", "no-std", "wifi", "radio", "hisilicon"]
categories = ["embedded", "no-std", "network-programming"]

[[example]]
name = "ws63_ble_u2_advertise"
path = "examples/ws63_ble_u2_advertise.rs"
required-features = ["chip-ws63", "profile-ble-dual-role", "u2-hil-diagnostics"]

[[example]]
name = "ws63_ble_u2_scan"
path = "examples/ws63_ble_u2_scan.rs"
required-features = ["chip-ws63", "profile-ble-dual-role", "u2-hil-diagnostics"]

[[example]]
name = "ws63_sle_u2_announce"
path = "examples/ws63_sle_u2_announce.rs"
required-features = ["chip-ws63", "profile-sle-ssap", "u2-hil-diagnostics"]

[[example]]
name = "ws63_sle_u2_seek"
path = "examples/ws63_sle_u2_seek.rs"
required-features = ["chip-ws63", "profile-sle-ssap", "u2-hil-diagnostics"]

[[example]]
name = "ws63_ble_u4_advertise_lifecycle"
path = "examples/ws63_ble_u4_advertise_lifecycle.rs"
required-features = ["chip-ws63", "profile-ble-dual-role", "u2-hil-diagnostics"]

[[example]]
name = "ws63_ble_u4_scan_lifecycle"
path = "examples/ws63_ble_u4_scan_lifecycle.rs"
required-features = ["chip-ws63", "profile-ble-dual-role", "u2-hil-diagnostics"]

[[example]]
name = "ws63_ble_u5_bond_peripheral"
path = "examples/ws63_ble_u5_bond_peripheral.rs"
required-features = ["chip-ws63", "profile-ble-dual-role", "u2-hil-diagnostics"]

[[example]]
name = "ws63_ble_u5_bond_central"
path = "examples/ws63_ble_u5_bond_central.rs"
required-features = ["chip-ws63", "profile-ble-dual-role", "u2-hil-diagnostics"]

[[example]]
name = "ws63_sle_u4_announce_lifecycle"
path = "examples/ws63_sle_u4_announce_lifecycle.rs"
required-features = ["chip-ws63", "profile-sle-ssap", "u2-hil-diagnostics"]

[[example]]
name = "ws63_sle_u4_seek_lifecycle"
path = "examples/ws63_sle_u4_seek_lifecycle.rs"
required-features = ["chip-ws63", "profile-sle-ssap", "u2-hil-diagnostics"]

[[example]]
name = "ws63_ble_u3_gatt_server"
path = "examples/ws63_ble_u3_gatt_server.rs"
required-features = ["chip-ws63", "profile-ble-dual-role", "u2-hil-diagnostics"]

[[example]]
name = "ws63_sle_u3_ssap_server"
path = "examples/ws63_sle_u3_ssap_server.rs"
required-features = ["chip-ws63", "profile-sle-ssap", "u2-hil-diagnostics"]

[dependencies]
hisi-rf-core = "=0.1.0-alpha.24"
hisi-rf-ws63 = { version = "=0.1.0-alpha.100", optional = true, default-features = false }
hisi-hal = { version = "0.7.0-alpha.9", optional = true, features = ["chip-ws63", "unstable"] }
smoltcp = { version = "0.13", optional = true, default-features = false }

[target.'cfg(target_arch = "riscv32")'.dev-dependencies]
hisi-hal = { version = "0.7.0-alpha.9", features = ["chip-ws63", "unstable"] }
hisi-panic-handler = { version = "0.1.0", default-features = false, features = ["panic-uart0"] }
hisi-rf-rtos-driver = "=0.1.0-alpha.20"
hisi-riscv-rt = { version = "0.5.10", default-features = false, features = [
    "chip-ws63",
    "bundled-memory-x",
    "boot-header",
    "ws63-bgle-32k",
    "ws63-radio-main-stack-32k",
] }
hisi-rtos = { version = "=0.1.0-alpha.25", features = ["chip-ws63"] }

[target.'cfg(not(target_arch = "riscv32"))'.dev-dependencies]
critical-section = { version = "1", features = ["std"] }

[features]
default = []
chip-ws63 = ["dep:hisi-rf-ws63"]
ble = ["hisi-rf-ws63?/ble-init", "dep:hisi-hal"]
sle = ["hisi-rf-ws63?/sle-init", "dep:hisi-hal"]
# Diagnostic-only WS63 packet-path instrumentation. This is intentionally
# separate from application profiles and is used for bounded HIL
# investigations, not normal firmware.
ws63-data-path-diagnostics = ["chip-ws63", "hisi-rf-ws63/data-path-diag"]
# Diagnostic-only A/B switch. Production profiles retain vendor STA PM policy.
ws63-station-pm-diagnostics = [
    "ws63-data-path-diagnostics",
    "hisi-rf-ws63/station-pm-diag",
]
incremental-backend-experiment = [
    "hisi-rf-core/incremental-backend-experiment",
    "hisi-rf-ws63?/incremental-backend-experiment",
]
incremental-embassy-wait = [
    "incremental-backend-experiment",
    "hisi-rf-ws63?/incremental-embassy-wait",
]
wifi = ["hisi-rf-ws63?/wifi", "dep:hisi-hal"]
smoltcp = ["dep:smoltcp", "hisi-rf-core/smoltcp", "hisi-rf-ws63?/smoltcp"]
wpa2-personal = ["wifi", "hisi-rf-ws63?/wpa2-personal"]
wpa3-personal = ["wifi", "hisi-rf-ws63?/wpa3-personal"]
# Application profiles select a complete, tested protocol + security + L2
# composition. The chip remains explicit so one profile never guesses hardware.
profile-wifi-wpa2-smoltcp = [
    "wifi",
    "smoltcp",
    "wpa2-personal",
    "incremental-embassy-wait",
]
profile-wifi-wpa3-smoltcp = [
    "wifi",
    "smoltcp",
    "wpa3-personal",
    "incremental-embassy-wait",
]
# Native upstream hostapd WPA2 SoftAP composition. This role is intentionally
# exclusive with station profiles because the target archives cannot coexist.
profile-wifi-wpa2-softap = [
    "smoltcp",
    "hisi-rf-ws63/upstream-authenticator-wpa2",
]
profile-wifi-wpa3-softap = [
    "smoltcp",
    "hisi-rf-ws63/upstream-authenticator-wpa3",
]
# Maintainer HIL profiles proving one admitted SoftAP composition can sustain
# connected local traffic while a second radio protocol remains connected.
# The backend types remain behind the facade's doc-hidden fixture module until
# the full public coexistence event/resource contract graduates.
profile-wifi-wpa2-softap-ble-coexistence = [
    "profile-wifi-wpa2-softap",
    "ble",
    "hisi-rf-ws63/coexistence-wifi-ble",
    "hisi-rf-ws63/firmware-example",
]
profile-wifi-wpa2-softap-sle-coexistence = [
    "profile-wifi-wpa2-softap",
    "sle",
    "hisi-rf-ws63/coexistence-wifi-sle",
    "hisi-rf-ws63/firmware-example",
]
# Named BLE/SLE profiles keep role selection visible in Cargo metadata. They
# currently share the same pinned WS63 archive and physical admission budget;
# the facade removes role-inapplicable control methods at compile time.
profile-ble-peripheral = ["ble"]
profile-ble-central = ["ble"]
profile-ble-dual-role = ["ble"]
profile-sle-announce = ["sle"]
profile-sle-seek = ["sle"]
profile-sle-ssap = ["sle"]
# Maintainer-only facade lifecycle evidence. Normal applications and public API
# snapshots do not select this migration feature; U4 will define the durable
# asynchronous event contract.
u2-hil-diagnostics = []
# Maintainer-only stateful HIL contract. A restored relationship is removed on
# both peers and queried as NotPaired; a subsequent reset must start empty.
u5-bond-removal-hil = ["u2-hil-diagnostics"]
# Maintainer-only U5D negative lifecycle fixtures. Both modes require an empty
# vendor bond store and are intentionally separate from the normal passkey path.
u5-pairing-reject-hil = ["u2-hil-diagnostics"]
u5-pairing-stale-hil = ["u2-hil-diagnostics"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
